# Server Configuration
server.port=8080
server.address=0.0.0.0

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/indoor_nav}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CRITICAL: Never re-execute data.sql on Spring Boot startup.
# Database seeding is handled exclusively by Docker's /docker-entrypoint-initdb.d/ on first boot.
# Running data.sql on every restart would overwrite admin-modified floor data via ON CONFLICT DO UPDATE.
spring.sql.init.mode=never

# Logging
logging.level.org.springframework=INFO
logging.level.com.indoor.nav=DEBUG

# Application Specific Configurations
app.upload.dir=./uploads

# Security
jwt.secret=${JWT_SECRET:4a7f29a0b3e6c9d81f5b4a7f29a0b3e6c9d81f5b4a7f29a0b3e6c9d81f5b4a7f}

# Deployment Configurations
app.qr.link.path=${APP_QR_LINK_PATH:../deployment/app_link.png}
app.deployment.config.path=${APP_DEPLOYMENT_CONFIG_PATH:./config/deployment.json}
